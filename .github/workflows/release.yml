name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 一致性自检（UI / IPC / 打包清单 / 版本 / 设置文档 / 语法）
        run: npm run check

      - name: 校验标签与 package.json 版本一致
        if: github.ref_type == 'tag'
        run: node scripts/check-tag.js

      - name: 确保 Electron 运行时已下载（npm postinstall 可能被跳过）
        run: node node_modules/electron/install.js

      - name: 构建 NSIS 安装包（脚本内已含清空 release 与 --publish never）
        run: npm run dist

      - name: 上传构建产物（手动触发时）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe

      - name: 发布到 GitHub Release（打 tag 时）
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
